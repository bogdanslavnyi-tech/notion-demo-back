name: Sync QA Approval to Notion

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: notion-qa-sync
  cancel-in-progress: false

jobs:
  sync-qa:
    name: Update Notion QA Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted notification helper
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Sync QA approvals
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const token = process.env.NOTION_TOKEN;
            const dataSourceId = process.env.NOTION_DATA_SOURCE_ID;
            const sendTeams = require('./.github/scripts/send-teams.js');
            if (!token || !dataSourceId) {
              core.setFailed('Notion configuration missing');
              return;
            }
            const headers = {
              Authorization: `Bearer ${token}`,
              'Notion-Version': '2026-03-11',
              'Content-Type': 'application/json',
            };
            const notionRequest = async (url, options = {}) => {
              const response = await fetch(url, { ...options, headers });
              if (!response.ok) throw new Error(`Notion HTTP ${response.status}: ${await response.text()}`);
              return response.json();
            };
            const tasks = [];
            let cursor;
            do {
              const body = { page_size: 100,
                filter: { property: 'Status', status: { equals: 'In QA' } } };
              if (cursor) body.start_cursor = cursor;
              const result = await notionRequest(
                `https://api.notion.com/v1/data_sources/${dataSourceId}/query`,
                { method: 'POST', body: JSON.stringify(body) }
              );
              tasks.push(...result.results);
              cursor = result.has_more ? result.next_cursor : undefined;
            } while (cursor);

            let updated = 0;
            let skipped = 0;
            let failures = 0;
            for (const task of tasks) {
              try {
                const props = task.properties;
                if (props.Repository?.select?.name !== 'Backend') {
                  skipped++;
                  continue;
                }
                const id = props['Task ID']?.unique_id;
                if (id?.number == null || !id.prefix) throw new Error('Task ID is missing');
                const ticketId = `${id.prefix}-${id.number}`;
                if (props.Status?.type !== 'status' ||
                    props['QA Approved']?.type !== 'checkbox' ||
                    props['AC Approved']?.type !== 'checkbox') {
                  throw new Error(`${ticketId}: Invalid Notion property types`);
                }
                if (props['QA Approved'].checkbox !== true || props['AC Approved'].checkbox !== true) {
                  skipped++;
                  continue;
                }
                await notionRequest(`https://api.notion.com/v1/pages/${task.id}`, {
                  method: 'PATCH', body: JSON.stringify({
                    properties: { Status: { status: { name: 'Ready For Merge' } } },
                  }),
                });
                updated++;
                core.info(`${ticketId}: In QA → Ready For Merge`);
                await sendTeams({ webhookUrl: process.env.TEAMS_WEBHOOK_URL, core,
                  ticket: task, ticketId, status: 'Ready For Merge', repository: 'Backend',
                  prUrl: props['PR URL']?.url,
                  event: 'QA and acceptance criteria approved — ready for release.' });
              } catch (error) {
                failures++;
                core.error(`Task ${task.id}: ${error.message}`);
              }
            }
            core.info(`QA synchronization: updated=${updated}, skipped=${skipped}, failed=${failures}`);
            if (failures > 0) core.setFailed(`${failures} tasks failed to synchronize`);
