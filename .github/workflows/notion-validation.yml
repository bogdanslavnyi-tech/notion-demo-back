name: Notion Validation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: notion-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-ticket:
    name: Validate Notion Ticket
    if: github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted notification helper
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate and sync Notion ticket
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const token = process.env.NOTION_TOKEN;
            const dataSourceId = process.env.NOTION_DATA_SOURCE_ID;
            const pr = context.payload.pull_request;
            const sendTeams = require('./.github/scripts/send-teams.js');
            if (!token || !dataSourceId || !pr) {
              core.setFailed('Notion configuration or PR payload missing');
              return;
            }
            const branch = pr.head.ref;
            const match = branch.match(/^(feat|fix|refactor|hotfix)\/(DEMO-\d+)-[a-z0-9-]+$/i);
            if (!match) {
              core.setFailed(`Invalid branch name: ${branch}`);
              return;
            }
            const ticketId = match[2].toUpperCase();
            const [prefix, number] = ticketId.split('-');
            const headers = {
              Authorization: `Bearer ${token}`,
              'Notion-Version': '2026-03-11',
              'Content-Type': 'application/json',
            };
            const notionRequest = async (url, options = {}) => {
              const response = await fetch(url, {
                ...options,
                headers: { ...headers, ...options.headers },
              });
              if (!response.ok) throw new Error(`Notion HTTP ${response.status}: ${await response.text()}`);
              return response.json();
            };
            const data = await notionRequest(
              `https://api.notion.com/v1/data_sources/${dataSourceId}/query`,
              { method: 'POST', body: JSON.stringify({
                filter: { property: 'Task ID', unique_id: { equals: Number(number) } },
              }) }
            );
            const tickets = data.results.filter(page => {
              const id = page.properties?.['Task ID']?.unique_id;
              return id?.prefix?.toUpperCase() === prefix && id?.number === Number(number);
            });
            if (data.has_more || tickets.length !== 1) {
              core.setFailed(`Ticket ${ticketId} not found or duplicated`);
              return;
            }
            const ticket = tickets[0];
            const props = ticket.properties;
            if (props.Repository?.select?.name !== 'Backend') {
              core.setFailed(`${ticketId}: Repository must be Backend`);
              return;
            }
            if (props.Branch?.type !== 'rich_text' || props['PR URL']?.type !== 'url' || props.Status?.type !== 'status') {
              core.setFailed('Notion Branch / PR URL / Status property type mismatch');
              return;
            }
            const currentStatus = props.Status.status?.name;
            const moveToReview = ['backlog', 'in progress'].includes(currentStatus?.toLowerCase());
            const updatedProperties = {
              Branch: { rich_text: [{ text: { content: branch } }] },
              'PR URL': { url: pr.html_url },
            };
            if (moveToReview) {
              updatedProperties.Status = { status: { name: 'In Review' } };
            }
            await notionRequest(`https://api.notion.com/v1/pages/${ticket.id}`, {
              method: 'PATCH', body: JSON.stringify({ properties: updatedProperties }),
            });

            // Keep a single managed block in the PR description.
            const startMarker = '<!-- notion-ticket:start -->';
            const endMarker = '<!-- notion-ticket:end -->';
            const notionBlock = [startMarker, '### Linked Notion Task', '',
              `[${ticketId}](${ticket.url})`, endMarker].join('\n');
            const currentBody = pr.body || '';
            const start = currentBody.indexOf(startMarker);
            const end = currentBody.indexOf(endMarker);
            const updatedBody = start >= 0 && end > start
              ? currentBody.slice(0, start) + notionBlock + currentBody.slice(end + endMarker.length)
              : [currentBody.trim(), notionBlock].filter(Boolean).join('\n\n');
            if (updatedBody !== currentBody) {
              await github.rest.pulls.update({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, body: updatedBody,
              });
            }
            core.info(`${ticketId}: ${currentStatus} → ${moveToReview ? 'In Review' : 'unchanged'}`);
            if (moveToReview) {
              await sendTeams({ webhookUrl: process.env.TEAMS_WEBHOOK_URL, core,
                ticket, ticketId, status: 'In Review', repository: 'Backend',
                prUrl: pr.html_url, event: 'Pull request opened into develop — code review requested.' });
            }
