
name: Notion Validation

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-ticket:
    name: Validate Notion Ticket
    runs-on: ubuntu-latest

    steps:
      - name: Validate and sync Notion ticket
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}

        with:
          script: |
            // ------------------------------------
            // 1. Configuration
            // ------------------------------------

            const branch = process.env.PR_BRANCH;
            const token = process.env.NOTION_TOKEN;
            const dataSourceId = process.env.NOTION_DATA_SOURCE_ID;
            const pr = context.payload.pull_request;

            if (!token || !dataSourceId) {
              core.setFailed("Notion credentials are not configured");
              return;
            }

            if (!pr) {
              core.setFailed("Pull Request payload is missing");
              return;
            }

            // ------------------------------------
            // 2. Extract Ticket ID
            // ------------------------------------

            const match = branch.match(
              /^(feat|fix|refactor|hotfix)\/(DEMO-\d+)-[a-z0-9-]+$/i
            );

            if (!match) {
              core.setFailed(`Invalid branch name: ${branch}`);
              return;
            }

            const ticketId = match[2].toUpperCase();
            const [prefix, number] = ticketId.split("-");

            core.info(`Looking for Notion ticket: ${ticketId}`);

            // ------------------------------------
            // 3. Find Ticket in Notion
            // ------------------------------------

            const response = await fetch(
              `https://api.notion.com/v1/data_sources/${dataSourceId}/query`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Notion-Version": "2026-03-11",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  filter: {
                    property: "Task ID",
                    unique_id: {
                      equals: Number(number),
                    },
                  },
                }),
              }
            );

            if (!response.ok) {
              core.setFailed(
                `Notion API returned HTTP ${response.status}`
              );
              return;
            }

            const data = await response.json();

            const tickets = data.results.filter((page) => {
              const id = page.properties?.["Task ID"]?.unique_id;

              return (
                id?.prefix === prefix &&
                id?.number === Number(number)
              );
            });

            if (tickets.length !== 1 || data.has_more) {
              core.setFailed(
                `Ticket ${ticketId} not found or duplicated`
              );
              return;
            }

            const ticket = tickets[0];

            // ------------------------------------
            // 4. Validate Repository
            // ------------------------------------

            const repository =
              ticket.properties?.Repository?.select?.name;

            if (repository !== "Backend") {
              core.setFailed(
                `Expected Backend repository, got: ${repository}`
              );
              return;
            }

            core.info(`Ticket ${ticketId} found successfully`);
            core.info(`Repository: ${repository}`);

            // ------------------------------------
            // 5. Validate Notion Properties
            // ------------------------------------

            const properties = ticket.properties;

            if (
              properties.Branch?.type !== "rich_text" ||
              properties["PR URL"]?.type !== "url" ||
              properties.Status?.type !== "status"
            ) {
              core.setFailed(
                "Notion properties Branch, PR URL or Status have incorrect types"
              );
              return;
            }

            const currentStatus = properties.Status.status?.name;

            const allowedStatuses = [
              "Backlog",
              "In Progress",
              "In Review",
            ];

            // ------------------------------------
            // 6. Prepare Notion Update
            // ------------------------------------

            const updatedProperties = {
              Branch: {
                rich_text: [
                  {
                    text: {
                      content: branch,
                    },
                  },
                ],
              },

              "PR URL": {
                url: pr.html_url,
              },
            };

            // Do not revert QA or completed tasks to In Review
            if (allowedStatuses.includes(currentStatus)) {
              updatedProperties.Status = {
                status: {
                  name: "In Review",
                },
              };
            }

            // ------------------------------------
            // 7. Synchronize GitHub → Notion
            // ------------------------------------

            const updateResponse = await fetch(
              `https://api.notion.com/v1/pages/${ticket.id}`,
              {
                method: "PATCH",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Notion-Version": "2026-03-11",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  properties: updatedProperties,
                }),
              }
            );

            if (!updateResponse.ok) {
              core.setFailed(
                `Notion update failed: HTTP ${updateResponse.status}`
              );
              return;
            }

            core.info(`Notion ticket ${ticketId} updated successfully`);

            // ------------------------------------
            // 8. Prepare Notion Link for PR
            // ------------------------------------

            const notionUrl = ticket.url;

            if (!notionUrl) {
              core.setFailed("Notion ticket URL is missing");
              return;
            }

            const markerStart = "<!-- notion-task:start -->";
            const markerEnd = "<!-- notion-task:end -->";

            const notionBlock = [
              markerStart,
              "### Linked Notion Task",
              "",
              `[${ticketId}](${notionUrl})`,
              markerEnd,
            ].join("\n");

            // ------------------------------------
            // 9. Fetch Latest PR Description
            // ------------------------------------

            const { data: currentPr } =
              await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

            const originalBody = currentPr.body || "";
            let updatedBody = originalBody;

            const startIndex =
              updatedBody.indexOf(markerStart);

            const endIndex =
              updatedBody.indexOf(markerEnd);

            // ------------------------------------
            // 10. Update or Append Notion Link
            // ------------------------------------

            if (startIndex !== -1 && endIndex !== -1) {
              if (endIndex < startIndex) {
                core.setFailed(
                  "Invalid Notion markers in PR description"
                );
                return;
              }

              updatedBody =
                updatedBody.slice(0, startIndex) +
                notionBlock +
                updatedBody.slice(
                  endIndex + markerEnd.length
                );
            } else if (
              startIndex !== -1 ||
              endIndex !== -1
            ) {
              core.setFailed(
                "Incomplete Notion markers in PR description"
              );
              return;
            } else {
              updatedBody = [
                updatedBody.trim(),
                notionBlock,
              ]
                .filter(Boolean)
                .join("\n\n");
            }

            // ------------------------------------
            // 11. Synchronize Notion → GitHub PR
            // ------------------------------------

            if (updatedBody !== originalBody) {
              try {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  body: updatedBody,
                });

                core.info(
                  `Notion link added to PR #${pr.number}`
                );
              } catch (error) {
                core.setFailed(
                  `Failed to update PR description: ${error.message}`
                );
                return;
              }
            } else {
              core.info(
                "Notion link is already up to date"
              );
            }

            // ------------------------------------
            // 12. Success
            // ------------------------------------

            core.info("------------------------------------");
            core.info(`Ticket: ${ticketId}`);
            core.info(`Repository: ${repository}`);
            core.info(`Branch: ${branch}`);
            core.info(`PR URL: ${pr.html_url}`);
            core.info(`Notion URL: ${notionUrl}`);
            core.info(`Status before sync: ${currentStatus}`);
            core.info("GitHub ↔ Notion synchronization completed");
