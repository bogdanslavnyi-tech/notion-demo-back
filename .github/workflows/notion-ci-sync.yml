
name: Sync CI to Notion

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    name: Update Notion CI Status
    runs-on: ubuntu-latest

    steps:
      - name: Sync CI result
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}

        with:
          script: |
            // ------------------------------------
            // 1. Configuration
            // ------------------------------------

            const token = process.env.NOTION_TOKEN;
            const dataSourceId = process.env.NOTION_DATA_SOURCE_ID;
            const run = context.payload.workflow_run;

            if (!token || !dataSourceId) {
              core.setFailed("Notion configuration is missing");
              return;
            }

            if (run.event !== "pull_request") {
              core.info("Not a PR workflow. Skipping.");
              return;
            }

            const supportedConclusions = [
              "success",
              "failure",
              "timed_out",
              "cancelled",
            ];

            if (!supportedConclusions.includes(run.conclusion)) {
              core.info(
                `Unsupported CI conclusion: ${run.conclusion}`
              );
              return;
            }

            // ------------------------------------
            // 2. Resolve Pull Request
            // ------------------------------------

            const prReference = run.pull_requests?.[0];

            if (!prReference) {
              core.warning(
                "No associated PR in workflow_run payload"
              );
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prReference.number,
            });

            if (pr.state !== "open") {
              core.info("PR is no longer open. Skipping.");
              return;
            }

            // ------------------------------------
            // 3. Validate Target Branch
            // ------------------------------------

            // Only sync feature PRs targeting develop.
            // Release PRs targeting main are handled separately.

            if (pr.base.ref !== "develop") {
              core.info(
                `Skipping PR targeting ${pr.base.ref}`
              );
              core.info(
                "Only feature PRs targeting develop are synchronized"
              );
              return;
            }

            core.info("Target branch: develop");

            // ------------------------------------
            // 4. Validate Current CI Revision
            // ------------------------------------

            const ciRunSha = run.head_sha;
            const currentHeadSha = pr.head.sha;

            let currentMergeSha = pr.merge_commit_sha;
            let mergeable = pr.mergeable;

            core.info(`PR head SHA: ${currentHeadSha}`);
            core.info(`CI run SHA: ${ciRunSha}`);

            // GitHub may calculate mergeability asynchronously.
            // Wait until the merge commit is available.

            if (mergeable === null) {
              core.info(
                "Waiting for GitHub mergeability calculation..."
              );

              for (let attempt = 1; attempt <= 5; attempt++) {
                await new Promise((resolve) =>
                  setTimeout(resolve, 2000)
                );

                const { data: updatedPr } =
                  await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                  });

                mergeable = updatedPr.mergeable;
                currentMergeSha = updatedPr.merge_commit_sha;

                core.info(
                  `Attempt ${attempt}: mergeable=${mergeable}`
                );

                if (mergeable !== null) {
                  break;
                }
              }
            }

            core.info(`PR merge SHA: ${currentMergeSha}`);

            if (mergeable === null) {
              core.setFailed(
                "GitHub mergeability calculation timed out"
              );
              return;
            }

            const isCurrentRun =
              ciRunSha === currentHeadSha ||
              (
                mergeable === true &&
                ciRunSha === currentMergeSha
              );

            if (!isCurrentRun) {
              core.info(
                "CI run belongs to an outdated PR revision. Skipping."
              );
              return;
            }

            core.info(
              "CI run matches the current PR revision"
            );

            // ------------------------------------
            // 5. Extract Notion Ticket ID
            // ------------------------------------

            const branch = pr.head.ref;

            const match = branch.match(
              /^(feat|fix|refactor|hotfix)\/(DEMO-\d+)-[a-z0-9-]+$/i
            );

            if (!match) {
              core.setFailed(`Invalid branch: ${branch}`);
              return;
            }

            const ticketId = match[2].toUpperCase();
            const [prefix, number] = ticketId.split("-");

            core.info(
              `Looking for Notion ticket: ${ticketId}`
            );

            // ------------------------------------
            // 6. Find Ticket in Notion
            // ------------------------------------

            const response = await fetch(
              `https://api.notion.com/v1/data_sources/${dataSourceId}/query`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Notion-Version": "2026-03-11",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  filter: {
                    property: "Task ID",
                    unique_id: {
                      equals: Number(number),
                    },
                  },
                }),
              }
            );

            if (!response.ok) {
              core.setFailed(
                `Notion query failed: HTTP ${response.status}`
              );
              return;
            }

            const data = await response.json();

            const tickets = data.results.filter((page) => {
              const id = page.properties?.["Task ID"]?.unique_id;

              return (
                id?.prefix === prefix &&
                id?.number === Number(number)
              );
            });

            if (tickets.length !== 1 || data.has_more) {
              core.setFailed(
                `Ticket ${ticketId} not found or duplicated`
              );
              return;
            }

            const ticket = tickets[0];

            // ------------------------------------
            // 7. Validate Notion Properties
            // ------------------------------------

            const repository =
              ticket.properties?.Repository?.select?.name;

            if (repository !== "Backend") {
              core.setFailed(
                `Expected Backend repository, got: ${repository}`
              );
              return;
            }

            if (
              ticket.properties?.["CI Status"]?.type !== "select"
            ) {
              core.setFailed(
                "CI Status must be a Select property"
              );
              return;
            }

            // ------------------------------------
            // 8. Determine CI Status
            // ------------------------------------

            const ciStatus =
              run.conclusion === "success"
                ? "Passed"
                : "Failed";

            core.info(`Ticket: ${ticketId}`);
            core.info(`PR: #${pr.number}`);
            core.info(`CI conclusion: ${run.conclusion}`);
            core.info(`New CI Status: ${ciStatus}`);

            // ------------------------------------
            // 9. Update Notion
            // ------------------------------------

            const updateResponse = await fetch(
              `https://api.notion.com/v1/pages/${ticket.id}`,
              {
                method: "PATCH",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Notion-Version": "2026-03-11",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  properties: {
                    "CI Status": {
                      select: {
                        name: ciStatus,
                      },
                    },
                  },
                }),
              }
            );

            if (!updateResponse.ok) {
              core.setFailed(
                `Notion update failed: HTTP ${updateResponse.status}`
              );
              return;
            }

            // ------------------------------------
            // 10. Success
            // ------------------------------------

            core.info("------------------------------------");
            core.info(`Successfully synchronized ${ticketId}`);
            core.info("Repository: Backend");
            core.info("Target branch: develop");
            core.info(`Branch: ${branch}`);
            core.info(`PR: ${pr.html_url}`);
            core.info(`CI Status: ${ciStatus}`);
            core.info(
              "GitHub CI → Notion synchronization completed"
            );
